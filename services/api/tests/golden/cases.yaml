# Golden set. Fields:
#   text, target            input and target language
#   expect_dict: [..]       expressions the DICTIONARY must detect (offline test) and the final output must contain
#   expect_model: [..]      expressions only the model can find (live eval only)
#   forbid: [..]            expressions that must NOT be reported (false positives: price "666", 润 in 利润...)
#   tr_any: [..]            translation must contain at least one (case-insensitive)
#   tr_none: [..]           translation must contain none (literal calques)
# Keyword checks are deliberately loose: they catch calques and misreadings, not style.

# ---------------------------------------------------------------- Chinese -> English/Spanish
- id: zh-meme-work-complaint
  text: 家人们谁懂啊，老板又在画大饼
  target: en
  expect_dict: [家人们谁懂啊, 画大饼]
  tr_any: [promise, pie in the sky, dangling, carrot, hollow, empty, pipe dream]
- id: zh-homophone-bengbu
  text: 我直接蚌埠住了
  target: en
  expect_dict: [蚌埠住了]
  tr_any: [hold it together, hold back, lose it, losing it, crack, can't help, couldn't help, break, can't take, lost it, hold in]
  tr_none: [bengbu]
