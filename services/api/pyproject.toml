[project]
name = "monet-api"
version = "0.1.0"
description = "Monet API: culturally-aware annotation (translation, phonetics, idioms & memes) and document processing"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "jieba>=0.42.1",
  "pypinyin>=0.53",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "pyjwt>=2.9",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "redis>=5.2",
  "alembic>=1.20.0",
]

[project.scripts]
monet-api = "monet_api.main:run"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monet_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls a real LLM provider (needs MONET_LIVE_TESTS=1 and an API key)",
  "db: needs Monet's Postgres (docker compose up db)",
]
filterwarnings = ["ignore::DeprecationWarning:jieba.*", "ignore:pkg_resources:UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101", "S311", "B008", "E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
