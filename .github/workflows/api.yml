name: api

on:
  push:
    paths: ["services/api/**", "contracts/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["services/api/**", "contracts/**", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/lint_lexicon.py
      - run: uv run pytest -q
